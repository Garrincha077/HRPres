[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hrpres-anon"
version = "0.3.0"
description = "Independent public Croatian ANON court-decision corpus"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = ["httpx>=0.27,<1.0", "beautifulsoup4>=4.12,<5.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]
embed = ["numpy>=1.26", "sentence-transformers>=3.3", "faiss-cpu>=1.10"]
onnx = ["numpy>=1.26,<3", "onnxruntime>=1.20,<2", "tokenizers>=0.21,<1", "huggingface-hub>=0.27,<2"]

[project.scripts]
hrpres = "hrpres.cli:main"
hrpres-embed = "hrpres.embed:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
